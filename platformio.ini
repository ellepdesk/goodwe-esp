; ESP32 replacement for the HF-A11 WiFi module in a GoodWe GW3600-DS.
;
; Environments:
;   s3-usb  - the firmware: dual-USB ESP32-S3 (DevKitC-1 layout) as USB host on the
;             inverter's USB port (src/usb); needs secrets.ini
;   native  - host build of the libraries for `pio test -e native`

[platformio]
default_envs = s3-usb
; WiFi/MQTT settings, kept out of git: copy secrets.ini.example to secrets.ini.
extra_configs = secrets.ini

[env]
platform = platformio/espressif32 @ ^7.0.1
framework = arduino
monitor_speed = 115200
test_ignore = *

[secrets]
build_flags =

[env:s3-usb]
board = esp32-s3-devkitc-1
build_src_filter = +<usb/>
lib_deps = knolleary/PubSubClient @ ^2.8
build_flags =
    ; Serial is UART0, i.e. the COM port; the native port belongs to the USB host.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; Status LED, one WS2812/SK6812: orange while the inverter waits, green in Normal,
    ; red on a fault or error bit, off without data. GPIO48 is the DevKitC-1's on-board
    ; LED (38 on v1.1); drop the line for none. -DSTATUS_LED_BRIGHTNESS=0-255, default 8.
    -DSTATUS_LED_PIN=48
    ${secrets.build_flags}

[env:native]
platform = native
framework =
build_flags = -std=c++17
test_ignore =
