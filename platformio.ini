; ESP32 replacement for the HF-A11 WiFi module in a GoodWe GW3600-DS.
;
; Environments:
;   s3-usb  - the firmware: dual-USB ESP32-S3 (DevKitC-1 layout) as USB host on the
;             inverter's USB port (src/usb); needs secrets.ini
;   c3, s3  - A11 header sniffer (src/sniffer) on a Seeed XIAO ESP32-C3/-S3, the fallback
;   native  - host build of the libraries for `pio test -e native`

[platformio]
default_envs = s3-usb
; WiFi/MQTT settings, kept out of git: copy secrets.ini.example to secrets.ini.
extra_configs = secrets.ini

[env]
platform = platformio/espressif32 @ ^7.0.1
framework = arduino
monitor_speed = 115200
test_ignore = *
build_flags =
    -DAA55_BAUD=9600           ; GoodWeLogger's fixed rate; confirm with the sniffer

; Optional status LED: one addressable RGB LED (WS2812/SK6812) on a GPIO, orange while the
; inverter waits, green in Normal, red on a fault or error bit, off without data. Add to an
; environment's build_flags:
;   -DSTATUS_LED_PIN=48        ; e.g. the on-board LED of an ESP32-S3-DevKitC-1 (38 on v1.1)
;   -DSTATUS_LED_BRIGHTNESS=32 ; 0-255, default 32
;
; Sniffer pins tap the two data lines on the A11's 2x7 header:
;   SNIFF_A11_RX_PIN <- A11 pin 3 (UART_TXD, what the module sends)
;   SNIFF_INV_RX_PIN <- A11 pin 4 (UART_RXD, what the inverter sends)
; Both are chosen to avoid strapping pins and the UART0 boot-log pins.

[secrets]
build_flags =

[env:s3-usb]
board = esp32-s3-devkitc-1
build_src_filter = +<usb/>
lib_deps = knolleary/PubSubClient @ ^2.8
build_flags =
    ${env.build_flags}
    ; Serial is UART0, i.e. the COM port; the native port belongs to the USB host.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSTATUS_LED_PIN=48
    ${secrets.build_flags}

[env:c3]
board = seeed_xiao_esp32c3
build_src_filter = +<sniffer/>
build_flags =
    ${env.build_flags}
    -DSNIFF_A11_RX_PIN=3
    -DSNIFF_INV_RX_PIN=4
    -DSNIFF_A11_UART=Serial0
    -DSNIFF_INV_UART=Serial1

[env:s3]
board = seeed_xiao_esp32s3
build_src_filter = +<sniffer/>
build_flags =
    ${env.build_flags}
    -DSNIFF_A11_RX_PIN=1
    -DSNIFF_INV_RX_PIN=2
    -DSNIFF_A11_UART=Serial1
    -DSNIFF_INV_UART=Serial2
    ; -DSTATUS_LED_PIN=3

[env:native]
platform = native
framework =
build_flags = -std=c++17
test_ignore =
